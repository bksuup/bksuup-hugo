baseurl = "https://blog.bkristian.net/"
title = "Home"
theme = "hugo-coder"
locale = "en"
defaultcontentlanguage = "en"


[pagination]
pagerSize = 20

# [services]
# [services.disqus]
# shortname = "bkstrand"

[markup.highlight]
style = "github-dark"

[params]
  author = "Bjørn Kristian Strand"
  info = "Platform Engineer @ Telenor"
  description = "Personal Blog"
  keywords = "blog,developer,personal"
  avatarurl = "images/fugl.jpeg"

  faviconSVG = "images/favicon.ico"
  favicon_32 = "images/favicon.ico"
  favicon_16 = "images/favicon.ico"

  since = 2026

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/bksuup"
[[params.social]]
  name = "LinkedIn"
  icon = "fa-brands fa-linkedin fa-2x"
  weight = 1
  url = "https://www.linkedin.com/in/bjoern-kristian-strand/"
# Menu links
[[menu.main]]
  name = "Blog"
  weight = 1
  url  = "posts/"
[[menu.main]]
  name = "Projects"
  weight = 2
  url = "projects/"
[[menu.main]]
  name = "About"
  weight = 3
  url = "about/"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
